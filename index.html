    </header>

    <div class="container">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="panel">
                <div class="panel-title">图层管理</div>
                <div class="layer-list" id="layer-list">
                    <label class="layer-item" data-layer="school">
                        <input type="checkbox" id="chk-school" checked>
                        <span class="dot dot-school"></span>
                        <span class="layer-name">学校</span>
                        <span class="count" id="cnt-school">0</span>
                    </label>
                    <label class="layer-item" data-layer="hospital">
                        <input type="checkbox" id="chk-hospital" checked>
                        <span class="dot dot-hospital"></span>
                        <span class="layer-name">医院</span>
                        <span class="count" id="cnt-hospital">0</span>
                    </label>
                    <label class="layer-item" data-layer="scenic">
                        <input type="checkbox" id="chk-scenic" checked>
                        <span class="dot dot-scenic"></span>
                        <span class="layer-name">景点</span>
                        <span class="count" id="cnt-scenic">0</span>
                    </label>
                    <label class="layer-item" data-layer="road">
                        <input type="checkbox" id="chk-road" checked>
                        <span class="dot dot-road"></span>
                        <span class="layer-name">道路</span>
                        <span class="count" id="cnt-road">0</span>
                    </label>
                    <label class="layer-item cluster-toggle" title="取消勾选：关闭聚合数字圆球，改为显示单个小圆点">
                        <input type="checkbox" id="chk-cluster" checked>
                        <span class="dot" style="background:#8e2a52"></span>
                        <span class="layer-name">聚合气泡（总开关）</span>
                    </label>
                </div>
                <div class="layer-actions">
                    <button id="btn-all" title="勾选全部图层">全选</button>
                    <button id="btn-none" title="取消全部勾选（全部隐藏）">全部隐藏</button>
                </div>
                <div class="count-tip">数字 = 当前视野内可见数量，随地图移动 / 缩放实时更新</div>
            </div>

            <div class="panel">
                <div class="panel-title">地点搜索</div>
                <input type="text" id="search-input" placeholder="输入名称，如：常德市第一中学">
                <div class="search-filter">
                    <span>类型筛选</span>
                    <select id="search-type">
                        <option value="">全部</option>
                        <option value="school">学校</option>
                        <option value="hospital">医院</option>
                        <option value="scenic">景点</option>
                        <option value="road">道路</option>
                    </select>
                </div>
                <div id="search-result"></div>
            </div>

            <div class="panel">
                <div class="panel-title">数据说明</div>
                <p class="note">学校 / 医院 / 景点：高德开放平台 POI 采集 + 周边同名复核，坐标 GCJ-02。</p>
                <p class="note">道路：路口 POI 锚点 + 步行路线描线构建主干道线要素（集中于武陵区）。</p>
                <p class="note">范围：学校 / 医院 / 景点覆盖武陵区、鼎城区；道路集中于武陵区。</p>
            </div>
        </aside>

                <button id="btn-area" title="测量多边形面积">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 5h4v4H3V5zm7 0h4v4h-4V5zm7 0h4v4h-4V5zM3 12h4v4H3v-4zm7 0h4v4h-4v-4zm7 0h4v4h-4v-4zM3 19h4v4H3v-4zm7 0h4v4h-4v-4zm7 0h4v4h-4v-4z" opacity=".9"/></svg>

                <button id="btn-legend" title="显示 / 隐藏图例">

                </button>
                <button id="btn-petal" title="关闭桃花花瓣飘落" class="petal-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3c-1.4 1.5-1.9 3.6-1.3 5.4.5 1.8 2.4 3.1 4.1 2.7 1.8-.4 2.8-2.3 2.3-4.1-.6-1.8-2.4-3.2-4.2-3.5-.4-.1-.7-.4-.9-.5zm0 7.2c-1.4 1.5-1.9 3.6-1.3 5.4.5 1.8 2.4 3.1 4.1 2.7 1.8-.4 2.8-2.3 2.3-4.1-.6-1.8-2.4-3.2-4.2-3.5-.4-.1-.7-.4-.9-.5zM6.5 9.4c-1.3 1.2-1.8 3-1.4 4.7.5 1.7 2.2 2.9 3.8 2.6 1.6-.3 2.5-2.1 2-3.8-.5-1.7-2.2-2.9-3.9-3.2-.2 0-.4-.2-.5-.3zm10.9.2c1.3 1.2 1.8 3 1.4 4.7-.5 1.7-2.2 2.9-3.8 2.6-1.6-.3-2.5-2.1-2-3.8.5-1.7 2.2-2.9 3.9-3.2.2 0 .4-.2.5-.3z"/></svg>
                    <span>花瓣</span>
                </button>
            </div>
            <div class="zoom-ctrl" id="zoom-ctrl">
                <button id="btn-zoom-in" title="放大地图">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
                </button>
                <button id="btn-zoom-out" title="缩小地图">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 11h14v2H5z"/></svg>
                </button>
            </div>
            <div id="measure-result" class="measure-result" hidden></div>
            <div id="map-toast" class="map-toast" hidden></div>
            <div id="legend-panel" class="legend-panel" hidden>
                <div class="legend-title">图例</div>
                <div class="legend-row"><span class="lg-dot" style="background:#2563eb"></span>学校</div>
                <div class="legend-row"><span class="lg-dot" style="background:#dc2626"></span>医院</div>
                <div class="legend-row"><span class="lg-dot" style="background:#059669"></span>景点</div>
                <div class="legend-row"><span class="lg-line" style="background:#d97706"></span>道路（主干道）</div>
                <div class="legend-note">数字圆点 = 同区域要素聚合数量，点击可放大查看单个点位</div>
            </div>
            <div id="petal-wrap" aria-hidden="true"></div>
        </main>
